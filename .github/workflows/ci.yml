name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: Install ocicl
        run: |
          git clone --depth 1 https://github.com/ocicl/ocicl.git /tmp/ocicl
          cd /tmp/ocicl && sbcl --non-interactive --load setup.lisp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: ocicl install
      - name: Run FiveAM tests
        run: |
          sbcl --non-interactive \
               --load ~/.local/share/ocicl/ocicl-runtime.lisp \
               --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
               --eval '(asdf:test-system "behemoth")'
